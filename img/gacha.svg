<svg width="800" height="200" viewBox="0 0 800 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <style>
    .slot-roll-1 { animation: rollUp1 1.2s steps(4) infinite; }
    .slot-roll-2 { animation: rollUp2 0.9s steps(4) infinite; }
    .slot-roll-3 { animation: rollUp3 1.5s steps(4) infinite; }
    
    @keyframes rollUp1 {
      0% { transform: translateY(0px); }
      100% { transform: translateY(-120px); }
    }
    @keyframes rollUp2 {
      0% { transform: translateY(0px); }
      100% { transform: translateY(-120px); }
    }
    @keyframes rollUp3 {
      0% { transform: translateY(0px); }
      100% { transform: translateY(-120px); }
    }
  </style>

  <rect width="800" height="200" rx="12" fill="#0d1117" />

  <text x="400" y="38" font-family="monospace" font-size="14" font-weight="bold" fill="#7a1b28" text-anchor="middle">GACHA LUCK</text>

  <!-- column 1 -->
  <rect x="300" y="60" width="60" height="90" rx="4" fill="#120306" stroke="#b31b1b" stroke-width="2" />
  <g clip-path="url(#clip-slot)">
    <g class="slot-roll-1" font-family="monospace" font-size="20" font-weight="bold" fill="#e05263" text-anchor="middle">
      <text x="330" y="85">꩜</text>
      <text x="330" y="115">♡</text>
      <text x="330" y="145">★</text>
      <text x="330" y="175">꩜</text>
    </g>
  </g>

  <!-- column 2 -->
  <rect x="370" y="60" width="60" height="90" rx="4" fill="#120306" stroke="#b31b1b" stroke-width="2" />
  <g clip-path="url(#clip-slot)">
    <g class="slot-roll-2" font-family="monospace" font-size="20" font-weight="bold" fill="#ffffff" text-anchor="middle">
      <text x="400" y="85">★</text>
      <text x="400" y="115">!</text>
      <text x="400" y="145">꩜</text>
      <text x="400" y="175">★</text>
    </g>
  </g>

  <!-- column 3 -->
  <rect x="440" y="60" width="60" height="90" rx="4" fill="#120306" stroke="#b31b1b" stroke-width="2" />
  <g clip-path="url(#clip-slot)">
    <g class="slot-roll-3" font-family="monospace" font-size="20" font-weight="bold" fill="#e05263" text-anchor="middle">
      <text x="470" y="85">!</text>
      <text x="470" y="115">♡</text>
      <text x="470" y="145">★</text>
      <text x="470" y="175">!</text>
    </g>
  </g>

  <clipPath id="clip-slot">
    <rect x="300" y="62" width="200" height="86" />
  </clipPath>
</svg>
