<svg width="700" height="40" viewBox="0 0 700 40" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="gothic-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feFlood flood-color="#40000d" flood-opacity="0.5" result="color" />
      <feComposite in="color" in2="blur" operator="in" result="glow" />
      <feMerge>
        <feMergeNode in="glow" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <g fill="#500010" filter="url(#gothic-glow)">
    <rect x="30" y="18" width="10" height="4" />
    <rect x="50" y="18" width="20" height="4" />
    <rect x="630" y="18" width="20" height="4" />
    <rect x="660" y="18" width="10" height="4" />
    
    <g>
      <rect x="100" y="16" width="500" height="8" rx="2" opacity="0.2" />
      <path d="M 335 12 L 345 12 L 345 24 L 355 24 L 355 12 L 365 12 L 365 28 L 335 28 Z" fill="#40000d">
        <animate attributeName="transform" type="translate" values="0,0; 0,-3; 0,0; 0,3; 0,0" dur="3s" repeatCount="indefinite" />
      </path>
    </g>
    
    <path d="M 80 20 H 620" stroke="#500010" stroke-width="3" stroke-dasharray="6 6">
      <animate attributeName="stroke-dashoffset" values="0;100" dur="5s" repeatCount="indefinite" />
    </path>
  </g>
</svg>
