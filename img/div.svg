<svg width="700" height="40" viewBox="0 0 700 40" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="gothic-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feFlood flood-color="#5a0015" flood-opacity="0.7" result="color" />
      <feComposite in="color" in2="blur" operator="in" result="glow" />
      <feMerge>
        <feMergeNode in="glow" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  
  <g fill="#70001c" filter="url(#gothic-glow)">
    <rect x="20" y="18" width="8" height="4" />
    <rect x="40" y="18" width="16" height="4" />
    <rect x="644" y="18" width="16" height="4" />
    <rect x="672" y="18" width="8" height="4" />

    <g>
      <rect x="100" y="16" width="500" height="8" rx="2" opacity="0.3" />
      <path d="M 320 12 L 330 12 L 330 24 L 340 24 L 340 12 L 350 12 L 350 28 L 320 28 Z" fill="#5a0015">
        <animate attributeName="transform" type="translate" values="0,0; 0,-3; 0,0; 0,3; 0,0" dur="3s" repeatCount="indefinite" />
      </path>
    </g>
    
    <path d="M 80 20 H 620" stroke="#800020" stroke-width="3" stroke-dasharray="6 6">
      <animate attributeName="stroke-dashoffset" values="0;100" dur="5s" repeatCount="indefinite" />
    </path>
  </g>
</svg>
