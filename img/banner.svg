<svg width="700" height="80" viewBox="0 0 700 80" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="burgundy-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feFlood flood-color="#A82046" flood-opacity="0.75" result="glowColor" />
      <feComposite in="glowColor" in2="blur" operator="in" result="softGlow" />
      <feMerge>
        <feMergeNode in="softGlow" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <clipPath id="typing-clip">
      <rect x="50" y="12" width="0" height="55">
        <animate attributeName="width" values="0; 600; 600; 0" keyTimes="0; 0.35; 0.85; 1" dur="5.5s" repeatCount="indefinite" />
      </rect>
    </clipPath>
  </defs>

  <style>
    .typing-text {
      font-family: 'UnifrakturMaguntia', 'Cinzel Decorative', serif;
      font-size: 26px; /* Ukuran font TETAP */
      font-weight: 400;
      fill: #800020; /* Warna dasar Burgundy TETAP */
      letter-spacing: 1px;
    }
  </style>

  <g clip-path="url(#typing-clip)">
    <text x="350" y="48" text-anchor="middle" class="typing-text" filter="url(#burgundy-glow)">
      welcome to my dashboard
    </text>
  </g>
</svg>
