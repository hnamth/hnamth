<svg width="700" height="80" viewBox="0 0 700 80" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="burgundy-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur1" />
      <feGaussianBlur stdDeviation="3" result="blur2" />
      <feFlood flood-color="#A82046" flood-opacity="0.9" result="glowColor" />
      <feComposite in="glowColor" in2="blur1" operator="in" result="softGlow1" />
      <feComposite in="glowColor" in2="blur2" operator="in" result="softGlow2" />
      
      <feMerge>
        <feMergeNode in="softGlow1" />
        <feMergeNode in="softGlow2" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <clipPath id="typing-clip">
      <rect x="50" y="12" width="0" height="55">
        <animate attributeName="width" values="0; 600; 600; 0" keyTimes="0; 0.35; 0.85; 1" dur="5.5s" repeatCount="indefinite" />
      </rect>
    </clipPath>
  </defs>

  <style>
    .typing-text {
      font-family: 'UnifrakturMaguntia', 'Cinzel Decorative', serif;
      font-size: 26px;
      font-weight: 400;
      fill: #800020; 
      letter-spacing: 1px;
    }
  </style>

  <g clip-path="url(#typing-clip)">
    <text x="350" y="48" text-anchor="middle" class="typing-text" filter="url(#burgundy-glow)">
      welcome to my dashboard
    </text>
  </g>
</svg>
